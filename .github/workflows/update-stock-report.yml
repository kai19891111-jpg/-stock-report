name: update-stock-report

on:
  schedule:
    - cron: "20 6 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch + backtest (final close only)
        run: |
          python scripts/update_market.py
          python scripts/backtest.py
      - name: Risk score
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python scripts/risk.py
      - name: Commit data
        run: |
          git config user.name "stock-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: refresh signals/trades/stats"
          git push
