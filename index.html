<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技術與基本面報告</title>
<style>body{margin:0;background:#07182e;color:#f7f4ee;font-family:sans-serif}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.card{background:rgba(8,32,64,.82);border:1px solid #8ec0ff;border-radius:10px;padding:10px}.px{font-size:22px;font-weight:700}.badge{padding:2px 6px;border-radius:99px;font-size:12px}.go{background:#1f7a4d;color:#fff}.hold{background:#1d4e89;color:#fff}.wait{background:#5c6570;color:#fff}.trim{background:#8a5a12;color:#fff}</style>
</head><body>
<header style="text-align:center;padding:12px"><h1>技術與基本面報告</h1><div id="stamps"></div></header>
<main style="max-width:1000px;margin:auto;padding:10px">
<section><h2>我的持倉</h2><div id="pos" class="cards"></div></section>
<section><h2>個股卡片 <span id="cnt"></span></h2><div id="chips"></div><div id="cards" class="cards"></div></section>
<section><h2>族群</h2><div id="groups"></div></section>
</main>
<script>
const STOCK_META={"TW|AI晶片": ["2330.TW", "2454.TW"], "TW|AI電源": ["2308.TW"], "TW|AI散熱": ["3324.TWO", "3653.TW", "3017.TW"], "TW|ABF": ["3189.TW", "3037.TW", "8046.TW"], "TW|CCL": ["6213.TW", "2383.TW"], "TW|面板／光電": ["3481.TW"], "TW|晶圓代工＋記憶體": ["6770.TW"], "TW|半導體廠務": ["2221.TWO"], "US|AI晶片": ["TSM", "NVDA", "AMD", "AVGO"], "US|AI雲端": ["MSFT", "META"], "US|AI記憶體": ["MU"], "US|AI自駕機器人": ["TSLA"], "US|航太科技": ["SPCX", "RKLB", "ASTS", "SATS"], "TW|AI伺服器／機櫃": ["8210.TW"], "TW|AI基建／電力": ["2371.TW"], "TW|光學／CPO": ["3406.TW"], "TW|記憶體": ["2408.TW"], "TW|CCL／電子材料": ["1303.TW"], "TW|PCB／銅箔": ["8358.TWO", "4958.TW"], "TW|電池監測IC": ["4919.TW"], "TW|被動元件": ["2327.TW"], "TW|NB機構件": ["1569.TWO"], "TW|低軌衛星": ["2313.TW", "3491.TWO", "6285.TW", "6271.TW", "2367.TW", "2355.TW"]};
const NAMES={"2330.TW": "台積電", "2454.TW": "聯發科", "2308.TW": "台達電", "SPCX": "SPCX", "RKLB": "Rocket Lab", "ASTS": "AST SpaceMobile", "SATS": "EchoStar", "2313.TW": "華通", "3491.TWO": "昇達科", "6285.TW": "啟祺", "6271.TW": "同欣電", "2367.TW": "燠華", "2355.TW": "敬鵬", "4958.TW": "臻鼎-KY", "^TWII": "加權指數", "^IXIC": "Nasdaq", "^SOX": "費城半導體", "3324.TWO": "3324.TWO", "3653.TW": "3653.TW", "3017.TW": "3017.TW", "3189.TW": "3189.TW", "3037.TW": "3037.TW", "8046.TW": "8046.TW", "6213.TW": "6213.TW", "2383.TW": "2383.TW", "3481.TW": "3481.TW", "6770.TW": "6770.TW", "2221.TWO": "2221.TWO", "TSM": "TSM", "NVDA": "NVDA", "AMD": "AMD", "AVGO": "AVGO", "MSFT": "MSFT", "META": "META", "MU": "MU", "TSLA": "TSLA", "8210.TW": "8210.TW", "2371.TW": "2371.TW", "3406.TW": "3406.TW", "2408.TW": "2408.TW", "1303.TW": "1303.TW", "8358.TWO": "8358.TWO", "4919.TW": "4919.TW", "2327.TW": "2327.TW", "1569.TWO": "1569.TWO"};
const DATA={};
const POS=[{code:"2330.TW",qty:10,cost:2572.1},{code:"4958.TW",qty:80,cost:481.9},{code:"SPCX",qty:34.49,cost:152.12,quote:167.54}];
const $=id=>document.getElementById(id);
const name=c=>NAMES[c]||c;
function cat(d){const b=d.bias||0;if(b>15)return["trim","過熱"];if(b<0)return["wait","均線之下"];if(b<=6)return["go","均線附近"];return["hold","偏高"];}
function render(){
  const codes=[];Object.values(STOCK_META).forEach(a=>a.forEach(c=>{if(DATA[c])codes.push(c)}));
  $("stamps").textContent="台股 "+(DATA["^TWII"]&&DATA["^TWII"].date||"");
  $("cards").innerHTML=codes.map(c=>{
    const d=DATA[c],[cls,lab]=cat(d);
    return `<div class="card"><b>${name(c)}</b> <small>${c}</small><div class="px">${d.p||"—"}</div><span class="badge ${cls}">${lab}</span> 乖離 ${(d.bias||0).toFixed(1)}%<div>SMA20 ${d.s20||"—"} SMA60 ${d.s60||"—"}</div><div>進場 ${d.entry||"—"}｜失效 ${d.invalid||"—"}｜目標 ${d.resist||"—"}｜RR ${d.rr!=null?Number(d.rr).toFixed(2):"—"}</div></div>`;
  }).join("");
  $("cnt").textContent="("+codes.length+"檔)";
  $("groups").innerHTML=Object.keys(STOCK_META).map(k=>`<div><b>${k}</b>: ${STOCK_META[k].map(name).join(", ")}</div>`).join("");
  $("pos").innerHTML=POS.map(p=>{const pr=p.quote||(DATA[p.code]&&DATA[p.code].p)||0;return `<div class="card">${name(p.code)} ${p.qty}股 成本${p.cost} 現價${pr}</div>`;}).join("");
}
render();
fetch("./data/latest.json",{cache:"no-store"}).then(r=>r.json()).then(L=>{
  if(!L||!L.quotes)return;
  Object.keys(L.quotes).forEach(c=>{
    if(!Object.values(STOCK_META).some(a=>a.includes(c)))return;
    const q=L.quotes[c];if(!q||!q.close)return;
    DATA[c]={p:q.close,date:q.date,s20:q.ma20,s60:q.ma60,bias:q.bias||0,entry:(q.entryLow&&q.entryHigh)?q.entryLow+"-"+q.entryHigh:"N/A",invalid:q.stop||"N/A",resist:q.target1||"N/A",rr:q.entryRR,high20:q.high20};
  });
  if(L.indexQuotes)Object.keys(L.indexQuotes).forEach(c=>{const q=L.indexQuotes[c];if(q&&q.close)DATA[c]={p:q.close,date:q.date};});
  render();
}).catch(()=>{});
</script></body></html>
