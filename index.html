<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術與基本面報告</title>
<style>
body{margin:0;background:#071221;color:#F6F1E7;font-family:"Noto Sans TC","PingFang TC",sans-serif;}
.boot{max-width:520px;margin:18vh auto;padding:24px;text-align:center;border:1px solid rgba(201,169,106,.28);}
.boot .k{color:#C9A96A;letter-spacing:.18em;font-size:11px;}
a{color:#C9A96A}
</style>
</head>
<body>
<div class="boot" id="boot">
  <p class="k">DAILY MARKET BRIEFING</p>
  <p>正在載入報告…</p>
</div>
<script>
(function(){
  var keepHash = location.hash || '#trade-alert';
  var SNAP = 'https://cdn.jsdelivr.net/gh/kai19891111-jpg/-stock-report@3c450fd06766bc59f991bd9c51d51e5dec1cd3b1/%20%20%20%20index.html';
  var SNAP2 = 'https://raw.githubusercontent.com/kai19891111-jpg/-stock-report/3c450fd06766bc59f991bd9c51d51e5dec1cd3b1/%20%20%20%20index.html';
  function boot(html){
    html = html.replace('</body>', '<script src="./quote.js"><\\/script><script src="./patch.js"><\\/script><script src="./upgrade-v2.js"><\\/script></body>');
    html = html.replace(
      '"SpaceX SPCX": {market:"美股", sub:"航太科技", watch:["航太科技"]}',
      '"SpaceX SPCX": {market:"美股", sub:"航太科技", watch:["航太科技"]}, "群創 3481.TW": {market:"台股", sub:"面板／光電", watch:["面板／光電"]}, "力積電 6770.TW": {market:"台股", sub:"晶圓代工＋記憶體", watch:["晶圓代工＋記憶體","AI記憶體"]}, "大甲 2221.TWO": {market:"台股", sub:"半導體廠務", watch:["半導體廠務"]}'
    );
    html = html.replace(
      '"AI記憶體": ["美光 MU"],',
      '"AI記憶體": ["美光 MU","力積電 6770.TW"], "面板／光電": ["群創 3481.TW"], "晶圓代工＋記憶體": ["力積電 6770.TW"], "半導體廠務": ["大甲 2221.TWO"],'
    );
    document.open();
    document.write(html);
    document.close();
    if (keepHash) {
      setTimeout(function(){
        location.hash = keepHash;
        var t = document.querySelector(keepHash);
        if (t) t.scrollIntoView();
      }, 80);
    }
  }
  function fail(e){
    var el = document.getElementById('boot');
    if (el) el.innerHTML = '<p>載入失敗</p><p>'+e+'</p>';
  }
  fetch(SNAP).then(function(r){ if(!r.ok) throw new Error('cdn '+r.status); return r.text(); }).then(boot).catch(function(){
    return fetch(SNAP2).then(function(r){ if(!r.ok) throw new Error('raw '+r.status); return r.text(); }).then(boot).catch(fail);
  });
})();
</script>
</body>
</html>
