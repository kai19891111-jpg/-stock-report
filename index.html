<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術與基本面報告</title>
<script src="./wallpaper.js"></script>
<style>
:root{--bg:#07182e;--card:rgba(8,32,64,.82);--accent:#ef3e42;--text:#f7f4ee;--muted:#c5d0de;--green:#3dd68c;--red:#ff6b6b;--blue:#8ec0ff;--amber:#ffb450;--line:rgba(255,255,255,.14);}
*{box-sizing:border-box;}
body{margin:0;color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;font-size:15px;background:var(--bg);}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,16,32,.28),rgba(5,16,32,.12) 40%,rgba(5,16,32,.4)),url("./assets/ohtani-cartoon.jpg") center 8px / min(94vw,calc((100dvh - 168px)*0.671)) auto no-repeat;background-color:var(--bg);}
header,nav,main,footer{position:relative;z-index:1;}
a{color:var(--blue);text-decoration:none;}
header{text-align:center;padding:18px 12px 12px;background:linear-gradient(180deg,rgba(5,16,32,.72),rgba(5,16,32,.5));}
header .brand{color:var(--accent);letter-spacing:.18em;font-size:11px;font-weight:700;}
header h1{margin:6px 0;font-size:1.35rem;}
.stamps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px;}
.stamp{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(8,28,58,.8);border:1px solid var(--line);color:var(--muted);}
.stamp b{color:var(--text);font-weight:600;}
.banner{max-width:1080px;margin:10px auto 0;padding:8px 12px;border-radius:10px;background:rgba(255,180,80,.16);border:1px solid var(--amber);color:#ffd9a3;font-size:13px;}
nav{position:sticky;top:0;z-index:99;background:linear-gradient(90deg,rgba(7,24,46,.96),rgba(0,70,150,.94) 58%,rgba(130,20,32,.92));border-bottom:3px solid var(--accent);padding:8px 12px;display:flex;gap:8px;overflow-x:auto;}
nav a{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;color:#fff;background:linear-gradient(180deg,#2b78d6,#0b4f9c);border:1px solid rgba(255,255,255,.4);}
main{max-width:1080px;margin:0 auto;padding:4px 12px 12px;}
.panel{background:rgba(8,28,58,.76);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:16px;padding:14px;margin:12px 0;}
.panel h2{margin:0 0 10px;font-size:1.05rem;border-left:4px solid var(--accent);padding-left:8px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.card{background:var(--card);border:1px solid rgba(142,192,255,.3);border-radius:14px;padding:12px;}
.card .title{font-weight:700;font-size:14px;}
.card .px{font-size:26px;font-weight:700;}
.note{font-size:12px;color:var(--muted);}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;}
.badge.go{background:#1f7a4d;color:#fff;}
.badge.hold{background:#1d4e89;color:#fff;}
.badge.trim{background:#8a5a12;color:#fff;}
.badge.wait{background:#5c6570;color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(8,28,58,.7);color:var(--text);cursor:pointer;}
.scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;}
footer{text-align:center;padding:16px 12px 28px;font-size:11px;color:var(--muted);}
@media(max-width:600px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>

</body>
</html>
